[workspace]
members = [
    "apps/nala",
    "apps/voice",
    "crates/agent-protocol",
    "crates/device-protocol",
    "crates/device-capabilities",
    "apps/pc-daemon",
    "apps/nala-overlay",
    "crates/mcp",
    "crates/tts",
    "crates/stt",
    "crates/process-group",
]
resolver = "3"

[workspace.dependencies]
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tungstenite = "0.24"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

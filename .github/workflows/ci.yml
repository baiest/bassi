name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system audio dev libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check LF line endings
        run: bash scripts/check_lf.sh

      - name: Check commit messages
        run: bash scripts/check_commit.sh

      - name: Rust checks (fmt, clippy, check, test)
        run: bash scripts/check_rust.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system audio dev libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage check
        run: bash scripts/check_coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info

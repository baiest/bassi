name: Auto-merge on approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    if: >
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (rebase + delete branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Default is rebase: keeps atomic commits from the branch as-is.
        # For a PR with messy/WIP commits, don't rely on this — merge it
        # manually instead with `gh pr merge --squash --delete-branch`.
        run: gh pr merge --auto --rebase --delete-branch "$PR_URL"
